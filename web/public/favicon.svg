<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Graphene Lab">
  <rect width="32" height="32" rx="7" fill="#0B1220"/>
  <g fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- central graphene hexagon (pointy-top) -->
    <polygon points="16,6 23.79,10.5 23.79,19.5 16,24 8.21,19.5 8.21,10.5"/>
    <!-- bonds extending into the lattice -->
    <path d="M16,6 V2.5"/>
    <path d="M23.79,10.5 L27,8.6"/>
    <path d="M23.79,19.5 L27,21.4"/>
    <path d="M16,24 V27.5"/>
    <path d="M8.21,19.5 L5,21.4"/>
    <path d="M8.21,10.5 L5,8.6"/>
  </g>
  <!-- carbon atoms at the vertices -->
  <g fill="#E2F3FF">
    <circle cx="16" cy="6" r="1.7"/>
    <circle cx="23.79" cy="10.5" r="1.7"/>
    <circle cx="23.79" cy="19.5" r="1.7"/>
    <circle cx="16" cy="24" r="1.7"/>
    <circle cx="8.21" cy="19.5" r="1.7"/>
    <circle cx="8.21" cy="10.5" r="1.7"/>
  </g>
</svg>
