# Minimal SearXNG config for the agent web_search tool (Track G, not yet wired).
# JSON output is enabled so the Go client can parse results.
use_default_settings: true

server:
  secret_key: "dev-insecure-searxng-key-change-me"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
