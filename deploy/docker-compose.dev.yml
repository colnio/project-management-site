# Local development stack. Host ports bind to 127.0.0.1 only — do not publish
# 0.0.0.0 on shared/CI hosts. Default credentials below are for local dev only;
# use strong secrets in any shared environment.
name: lab-pm

networks:
  lab_internal:
    driver: bridge

services:
  postgres:
    image: postgres:16
    networks: [lab_internal]
    environment:
      # Dev-only defaults — change before exposing beyond localhost.
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    networks: [lab_internal]
    command: server /data --console-address ":9001"
    environment:
      # Dev-only defaults — not for production.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the artifact buckets once MinIO is up.
  minio-init:
    image: minio/mc:latest
    networks: [lab_internal]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/artifacts-originals;
      mc mb --ignore-existing local/artifacts-rendered;
      mc anonymous set download local/artifacts-rendered;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    networks: [lab_internal]
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # web UI
    environment:
      MP_MAX_MESSAGES: "5000"

  nbconvert:
    build:
      context: ./nbconvert
    networks: [lab_internal]
    ports:
      - "127.0.0.1:8090:8090"

  searxng:
    image: searxng/searxng:latest
    networks: [lab_internal]
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:8888/"

volumes:
  pgdata:
  miniodata:
